name: Compile LaTeX, Commit, and Save Artifact

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.pdf" # Crucial: Prevents an infinite loop when the bot pushes the PDF

jobs:
  build_and_track:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the workflow to push the PDF back to your repository
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: latex/main.tex

      - name: Commit and push PDF to root
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add main.pdf

          if git diff --staged --quiet; then
            echo "No changes detected in the compiled PDF."
          else
            git commit -m "chore: update compiled PDF [skip ci]"
            git push
          fi

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-latex-pdf
          path: main.pdf